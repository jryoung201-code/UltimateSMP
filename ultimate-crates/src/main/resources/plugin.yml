name: UltimateCrates
version: 1.2.0
main: shop.ultimatesmp.crates.UltimateCrates
api-version: '1.21.11'
softdepend: [BlinkNetwork, UltimateRanks, UltimateSpawn]
author: Aven
commands:
  crates:
    aliases: [crate, ucrates]
    description: Customize crates, rewards and keys
    usage: /crates
  keyall:
    description: Give crate keys to every ready player on this backend
    usage: /keyall <crate> [amount]
permissions:
  ultimatecrates.admin:
    default: op
  ultimatecrates.use:
    default: true
