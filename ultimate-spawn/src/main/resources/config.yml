# Blank uses BlinkNetwork's bootstrap-server. Keep identical config on both backends.
spawn-server: ''
world-name: ultimate_spawn
world-border-size: 256
warmup-seconds: 3
cooldown-seconds: 5
# JDBC credentials are read from BlinkNetwork. MySQL/MariaDB required.


# Duels are hosted only on spawn-server. Requests and accepts require both players in spawn.
# This is a NEW plugin-owned arena world; never point it at an existing gameplay world.
duels:
  enabled: true
  world-name: ultimate_duel_arena
  request-seconds: 30
  countdown-seconds: 3
  max-seconds: 300
