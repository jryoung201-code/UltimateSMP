name: UltimateShop
version: 1.3.4
main: shop.ultimatesmp.shop.UltimateShop
api-version: '1.21.11'
depend: [UltimateRanks]
softdepend: [BlinkNetwork, UltimateCrates]
commands:
  link:
    description: Link your Discord account using a private code
    usage: /link <code>
  shop:
    description: Link your Minecraft account to the website shop
    usage: /shop
  ultimateshop:
    description: Manage shared shop rank packages
    usage: /ultimateshop <give|revoke|status|reload>
permissions:
  ultimateshop.admin:
    default: op
