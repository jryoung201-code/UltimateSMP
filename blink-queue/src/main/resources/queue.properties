# Install only on Velocity, together with LimboAPI 1.2.0. Proxy runtime: Java 25.
enabled=true
queue-server=BlinkSMP-Queue-01
# Used ONLY without BlinkNetwork. Must be registered in velocity.toml.
default-server=BlinkSMP-Overworld-01
# Absolute cap for a waiting attempt, including repeated connection failures.
max-wait-seconds=180
# One shared readiness probe, not one per waiting player.
poll-seconds=3
ping-timeout-seconds=3
max-waiting-players=100
# Optional operator-owned HTTPS start endpoint. POST with no body. No redirects.
# Environment overrides: BLINK_QUEUE_START_URL and BLINK_QUEUE_START_TOKEN (Bearer).
queue-start-url=
start-retry-seconds=60
# With BlinkNetwork 0.3.1+, startup is delegated here so no duplicate POSTs are sent.
