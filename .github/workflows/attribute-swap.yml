name: Build UltimateAttributeSwap
on:
  push:
    paths: ['ultimate-attribute-swap/**', '.github/workflows/attribute-swap.yml']
  pull_request:
    paths: ['ultimate-attribute-swap/**', '.github/workflows/attribute-swap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ultimate-attribute-swap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package
        run: mvn --batch-mode --no-transfer-progress package
      - name: Verify runtime switch lifecycle
        run: java -cp target/classes:target/test-classes shop.blinksmp.swap.EquipmentSwitchTest
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateAttributeSwap-1.0.0
          path: ultimate-attribute-swap/target/UltimateAttributeSwap-1.0.0.jar
          if-no-files-found: error
