name: Build UltimateSpawn integration
on:
  push:
    paths: ['ultimate-spawn/**', 'ultimate-ranks/**', 'blink-network/**', 'ultimate-network/paper/**', '.github/workflows/spawn.yml']
  pull_request:
    paths: ['ultimate-spawn/**', 'ultimate-ranks/**', 'blink-network/**', 'ultimate-network/paper/**', '.github/workflows/spawn.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spawn:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable
          MARIADB_DATABASE: spawn_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      TEST_SPAWN_JDBC: jdbc:mariadb://127.0.0.1:3306/spawn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify spawn protection and shared metadata
        run: mvn -B -ntp -f ultimate-spawn/pom.xml verify
      - name: Build network compatibility and rank configuration updates
        run: |
          mvn -B -ntp -f blink-network/pom.xml package -DskipTests
          mvn -B -ntp -f ultimate-ranks/pom.xml package dependency:build-classpath -Dmdep.outputFile=target/test-classpath
          java -cp "ultimate-ranks/target/classes:ultimate-ranks/target/test-classes:$(cat ultimate-ranks/target/test-classpath)" shop.blinksmp.ranks.SpawnPermissionTest
          mvn -B -ntp -f ultimate-network/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateSpawn-Install-1.1.3
          if-no-files-found: error
          path: |
            ultimate-spawn/target/UltimateSpawn-1.1.3.jar
            ultimate-ranks/target/UltimateRanks-1.3.1.jar
            blink-network/paper/target/BlinkNetwork-Paper-0.5.5.jar
            blink-network/velocity/target/BlinkNetwork-Velocity-0.5.5.jar
            ultimate-network/paper/target/UltimateNetwork-Paper-1.0.1.jar
