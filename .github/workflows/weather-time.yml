name: Build UltimateWeatherTime
on:
  push:
    paths: ['ultimate-weather-time/**', '.github/workflows/weather-time.yml']
  pull_request:
    paths: ['ultimate-weather-time/**', '.github/workflows/weather-time.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable
          MARIADB_DATABASE: weather_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      TEST_WEATHER_JDBC: jdbc:mariadb://127.0.0.1:3306/weather_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile Paper adapter and verify MariaDB world isolation
        run: mvn -B -ntp -f ultimate-weather-time/pom.xml verify
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateWeatherTime-1.0.0
          path: ultimate-weather-time/target/UltimateWeatherTime-1.0.0.jar
          if-no-files-found: error
