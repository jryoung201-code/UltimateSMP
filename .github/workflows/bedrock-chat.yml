name: Build UltimateBedrockChat
on:
  push:
    paths: ['bedrock-chat/**', 'ultimate-gui/**', '.github/workflows/bedrock-chat.yml']
  pull_request:
    paths: ['bedrock-chat/**', 'ultimate-gui/**', '.github/workflows/bedrock-chat.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bedrock-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the prebound admin panel
        run: |
          mvn --batch-mode --no-transfer-progress -f ../ultimate-gui/pom.xml package
          java -cp ../ultimate-gui/target/classes:../ultimate-gui/target/test-classes shop.blinksmp.gui.GuiRulesTest
          python3 --version
          python3 package-admin.py
      - name: Compile and package
        run: mvn --batch-mode --no-transfer-progress package dependency:build-classpath -Dmdep.outputFile=target/test-classpath
      - name: Verify chat validation
        run: |
          java -cp target/classes:target/test-classes shop.blinksmp.chat.PrivateMessagePolicyTest
          java -cp "target/classes:target/test-classes:$(cat target/test-classpath)" shop.blinksmp.chat.PrivateMessagesTest
          java -cp target/classes:target/test-classes shop.blinksmp.chat.ChatPolicyTest
          java -cp target/classes:target/test-classes shop.blinksmp.chat.AdminInstallerTest
          java -cp target/classes:target/test-classes shop.blinksmp.chat.BundledInstallTest
          java -cp "target/classes:target/test-classes:$(cat target/test-classpath)" shop.blinksmp.chat.BootstrapLoadTest
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateBedrockChat-1.0.3
          path: bedrock-chat/target/UltimateBedrockChat-1.0.3.jar
          if-no-files-found: error
