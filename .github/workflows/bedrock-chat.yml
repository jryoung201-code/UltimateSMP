name: Build UltimateBedrockChat
on:
  push:
    paths: ['bedrock-chat/**', '.github/workflows/bedrock-chat.yml']
  pull_request:
    paths: ['bedrock-chat/**', '.github/workflows/bedrock-chat.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bedrock-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package
        run: mvn --batch-mode --no-transfer-progress package
      - name: Verify chat validation
        run: java -cp target/classes:target/test-classes shop.blinksmp.chat.ChatPolicyTest
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateBedrockChat-1.0.0
          path: bedrock-chat/target/UltimateBedrockChat-1.0.0.jar
          if-no-files-found: error
