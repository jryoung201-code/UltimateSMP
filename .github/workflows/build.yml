name: Build UltimateOptimize
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package
        run: mvn --batch-mode --no-transfer-progress package
      - name: Verify pressure controller
        run: java -cp target/classes:target/test-classes shop.blinksmp.ultimateoptimize.PolicyTest
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateOptimize-1.0.0
          path: target/UltimateOptimize-1.0.0.jar
          if-no-files-found: error
