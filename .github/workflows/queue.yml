name: Build BlinkQueue
on:
  push:
    paths: ['blink-queue/**', '.github/workflows/queue.yml']
  pull_request:
    paths: ['blink-queue/**', '.github/workflows/queue.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test waiting room
        run: mvn -B -ntp -f blink-queue/pom.xml verify
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkQueue-1.0.0
          path: |
            blink-queue/target/BlinkQueue-Velocity-1.0.0.jar
            blink-queue/README.md
          if-no-files-found: error
