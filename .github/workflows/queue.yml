name: Build BlinkQueue
on:
  push:
    paths: ['blink-queue/**', '.github/workflows/queue.yml']
  pull_request:
    paths: ['blink-queue/**', '.github/workflows/queue.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install pinned official LimboAPI release for compilation
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/limboapi-1.2.0.jar" https://github.com/Elytrium/LimboAPI/releases/download/1.2.0/limboapi-1.2.0.jar
          echo "25582ebf5567fec1c20a03ad2c6e01fa05911a76749c67e7b0192acf508f7d31  $RUNNER_TEMP/limboapi-1.2.0.jar" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$RUNNER_TEMP/limboapi-1.2.0.jar" -DgroupId=net.elytrium.limboapi -DartifactId=api -Dversion=1.2.0 -Dpackaging=jar -DgeneratePom=true
      - name: Build and test waiting room
        run: mvn -B -ntp -f blink-queue/pom.xml verify
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkQueue-1.1.0
          path: |
            blink-queue/target/BlinkQueue-Velocity-1.1.0.jar
            blink-queue/README.md
          if-no-files-found: error
