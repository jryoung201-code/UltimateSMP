name: Build UltimateShop
on:
  push:
    paths: ['ultimate-shop/**', 'ultimate-discord/**', 'ultimate-ranks/**', 'ultimate-crates/**', '.github/workflows/shop.yml']
  pull_request:
    paths: ['ultimate-shop/**', 'ultimate-discord/**', 'ultimate-ranks/**', 'ultimate-crates/**', '.github/workflows/shop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable
          MARIADB_DATABASE: shop_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_JDBC_URL: jdbc:mariadb://localhost:3306/shop_test
      TEST_DB_USER: root
      TEST_DB_PASSWORD: disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix ultimate-discord run check
      - run: mvn -B -ntp -f ultimate-shop/pom.xml verify
      - run: mvn -B -ntp -f ultimate-crates/pom.xml verify
      - run: mvn -B -ntp -f ultimate-ranks/pom.xml package dependency:build-classpath -Dmdep.outputFile=target/test-classpath
      - name: Verify all existing rank policies and shop overlay
        working-directory: ultimate-ranks
        run: |
          for test in HomePermissionTest VanishBridgeTest RulesTest StoreTest MultiRankTest SpawnPermissionTest TemporaryRankTest ShopRankTest; do
            java -cp "target/classes:target/test-classes:$(cat target/test-classpath)" shop.blinksmp.ranks.$test
          done
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateShop-1.3.1-and-UltimateRanks-1.3.3
          path: |
            ultimate-shop/target/UltimateShop-1.3.1.jar
            ultimate-ranks/target/UltimateRanks-1.3.3.jar
            ultimate-shop/DISCORD-PAPER.md
            ultimate-shop/README.md
            ultimate-shop/KEYS-AND-PRICES.md
            ultimate-crates/target/UltimateCrates-1.2.2.jar
          if-no-files-found: error

