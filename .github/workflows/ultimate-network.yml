name: Build UltimateNetwork integration
on:
  push:
    paths: ['ultimate-network/**', 'ultimate-ranks/**', 'ultimate-settings/**', 'ultimate-trades/**', 'ultimate-homes/**', 'ultimate-announcements/**', 'blink-network/**', '.github/workflows/ultimate-network.yml']
  pull_request:
    paths: ['ultimate-network/**', 'ultimate-ranks/**', 'ultimate-settings/**', 'ultimate-trades/**', 'ultimate-homes/**', 'ultimate-announcements/**', 'blink-network/**', '.github/workflows/ultimate-network.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test network bridge and both platform adapters
        run: mvn -B -ntp -f ultimate-network/pom.xml verify
      - name: Build inventory handoff compatibility update
        run: mvn -B -ntp -f blink-network/pom.xml package -DskipTests
      - name: Build existing plugin adapters
        run: |
          mvn -B -ntp -f ultimate-ranks/pom.xml package
          mvn -B -ntp -f ultimate-settings/pom.xml package
          mvn -B -ntp -f ultimate-trades/pom.xml package
          mvn -B -ntp -f ultimate-homes/pom.xml package
          mvn -B -ntp -f ultimate-announcements/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateNetwork-1.0.0
          if-no-files-found: error
          path: |
            ultimate-network/paper/target/UltimateNetwork-Paper-1.0.0.jar
            ultimate-network/velocity/target/UltimateNetwork-Velocity-1.0.0.jar
            blink-network/paper/target/BlinkNetwork-Paper-0.5.2.jar
            blink-network/velocity/target/BlinkNetwork-Velocity-0.5.2.jar
            ultimate-ranks/target/UltimateRanks-1.3.0.jar
            ultimate-settings/target/UltimateSettings-1.2.0.jar
            ultimate-trades/target/UltimateTrades-1.1.0.jar
            ultimate-homes/target/UltimateHomes-1.2.0.jar
            ultimate-announcements/target/UltimateAnnouncements-1.1.0.jar

