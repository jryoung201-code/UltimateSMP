name: Build UltimateLodestones
on:
  push:
    paths: ['ultimate-lodestones/**', '.github/workflows/lodestones.yml']
  pull_request:
    paths: ['ultimate-lodestones/**', '.github/workflows/lodestones.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ultimate-lodestones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn --batch-mode --no-transfer-progress package dependency:build-classpath -Dmdep.outputFile=target/test-classpath
      - name: Verify portable compass behavior
        run: java -cp "target/classes:target/test-classes:$(cat target/test-classpath)" shop.blinksmp.lodestones.CompassTest
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateLodestones-1.0.0
          path: ultimate-lodestones/target/UltimateLodestones-1.0.0.jar
          if-no-files-found: error
