name: Build BlinkNetwork
on:
  push:
    paths: ['blink-network/**', '.github/workflows/network.yml']
  pull_request:
    paths: ['blink-network/**', '.github/workflows/network.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blinknetwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_JDBC_URL: jdbc:postgresql://localhost:5432/blinknetwork_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test against PostgreSQL
        run: mvn -B -ntp -f blink-network/pom.xml verify
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BlinkNetwork-0.2.1
          path: |
            blink-network/paper/target/BlinkNetwork-Paper-0.2.1.jar
            blink-network/velocity/target/BlinkNetwork-Velocity-0.2.1.jar
            blink-network/README.md
            blink-network/WEBSITE-INTEGRATION.md
            blink-network/common/src/main/resources/schema.sql
          if-no-files-found: error
