name: Build BlinkNetwork
on:
  push:
    paths: ['blink-network/**', '.github/workflows/network.yml']
  pull_request:
    paths: ['blink-network/**', '.github/workflows/network.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: PostgreSQL
            image: postgres:16
            health: pg_isready -U postgres
            jdbc: jdbc:postgresql://localhost:5432/blinknetwork_test
            user: postgres
          - backend: MySQL
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -ppostgres
            jdbc: jdbc:mariadb://localhost:3306/blinknetwork_test?allowPublicKeyRetrieval=true
            user: root
          - backend: MariaDB
            image: mariadb:11.4
            health: healthcheck.sh --connect --innodb_initialized
            jdbc: jdbc:mariadb://localhost:3306/blinknetwork_test
            user: root
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blinknetwork_test
          MYSQL_ROOT_PASSWORD: postgres
          MYSQL_DATABASE: blinknetwork_test
          MARIADB_ROOT_PASSWORD: postgres
          MARIADB_DATABASE: blinknetwork_test
        ports:
          - 5432:5432
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_JDBC_URL: ${{ matrix.jdbc }}
      TEST_DB_USER: ${{ matrix.user }}
      TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test database safety
        run: mvn -B -ntp -f blink-network/pom.xml verify
      - if: matrix.backend == 'PostgreSQL' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: BlinkNetwork-0.5.0
          path: |
            blink-network/paper/target/BlinkNetwork-Paper-0.5.0.jar
            blink-network/velocity/target/BlinkNetwork-Velocity-0.5.0.jar
            blink-network/README.md
            blink-network/WEBSITE-INTEGRATION.md
            blink-network/common/src/main/resources/schema.sql
            blink-network/common/src/main/resources/schema-mysql.sql
          if-no-files-found: error
