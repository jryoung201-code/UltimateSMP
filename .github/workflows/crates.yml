name: Build UltimateCrates
on:
  push:
    paths: ['ultimate-crates/**', '.github/workflows/crates.yml']
  pull_request:
    paths: ['ultimate-crates/**', '.github/workflows/crates.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable
          MARIADB_DATABASE: crates_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_JDBC_URL: jdbc:mariadb://localhost:3306/crates_test
      TEST_DB_USER: root
      TEST_DB_PASSWORD: disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -f ultimate-crates/pom.xml verify
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateCrates-1.2.1
          path: |
            ultimate-crates/target/UltimateCrates-1.2.1.jar
            ultimate-crates/README.md
          if-no-files-found: error

