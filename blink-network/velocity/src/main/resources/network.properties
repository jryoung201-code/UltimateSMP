# Copied into plugins/blinknetwork/network.properties on first start.
enabled=false
bootstrap-server=BlinkSMP-Overworld-01
# Environment variables take precedence. Never commit real credentials.
jdbc-url=
username=
password=

# Register the dedicated Paper queue in velocity.toml under exactly this name.
queue-server=BlinkSMP-Queue-01
# Optional operator-owned HTTPS start endpoint; POST with no body. Credentials in env only.
# BLINK_QUEUE_START_URL overrides this. BLINK_QUEUE_START_TOKEN is an optional Bearer token.
queue-start-url=
