# Install on every Paper backend, NOT on Velocity. Requires Java 21 / Paper 1.21.11.
# Run once to create this file, configure, then fully restart. No /reload support.
enabled: false
# Use world on every gameplay backend. Queue is hosted virtually on Velocity.
role: world
# Internal protocol/status identifier. No physical queue server is needed.
queue-id: BlinkSMP-Queue-01
all-dimensions: true
worlds:
  Overworld: world
  Nether: world_nether
  End: world_the_end
server-id: BlinkSMP-Overworld-01
# Local Bukkit world for THIS server's assigned dimension.
world: world
bootstrap-server: BlinkSMP-Overworld-01
# Enable only on the bootstrap server when deliberately importing local player data.
import-local-players: false
# Explicitly confirm Velocity modern forwarding and firewall/secret are configured.
proxy-security-configured: false
# Set allow-nether=true in server.properties and allow-end=true in bukkit.yml.
# Use JDBC syntax; credentials can instead be read from environment variables below.
database:
  jdbc-url: ''
  username: ''
  password: ''
# Environment variables take precedence:
# BLINK_NETWORK_JDBC_URL=jdbc:postgresql://HOST/DATABASE?sslmode=verify-full
# BLINK_NETWORK_DB_USER=ROLE
# BLINK_NETWORK_DB_PASSWORD=PASSWORD

# Additive schema v2 must be applied on Neon before enabling profile sync.
# All Paper backends must use the same choices. Disabled until plugin adapters are verified.
profile-sync:
  enabled: false
  # Temporarily true ONLY on the original bootstrap server for a one-time import
  # of existing locally stored player ranks, homes and settings when Neon has no module.
  seed-missing-from-local: false
  ranks: true
  sanctions: true
  homes: true
  settings: true
  advancements: false
  statistics: true
# Advancements are off by default: Bukkit criterion grants can trigger rewards.

# A private, non-blocking particle wall at the edge of your own server's regions.
# Cyan: another server. Red: unassigned region. Nothing is placed in the world.
particle-border:
  enabled: true
  interval-ticks: 10
  distance: 24
  horizontal-spacing: 3
  vertical-spacing: 2
  height: 8
  server-color: '#33CCFF'
  unassigned-color: '#FF5555'

