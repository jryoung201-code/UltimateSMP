# Highest weight supplies the visible chat/TAB tag and sorts first in TAB.
# Weights do not grant staff authority. Permissions from all assigned ranks combine.
weights:
  OWNER: 600
  DEV: 500
  ADMIN: 400
  MOD: 300
  TRIAL_MOD: 200
  HELPER: 100
  BLINK_PLUS_PLUS_PLUS: 30
  BLINK_PLUS_PLUS: 20
  BLINK_PLUS: 10
  MEMBER: 0

prefixes:
  OWNER: '&4&l[OWNER] &r'
  DEV: '&b&l[DEV] &r'
  ADMIN: '&c&l[ADMIN] &r'
  MOD: '&2&l[MOD] &r'
  TRIAL_MOD: '&e[TRIAL MOD] &r'
  HELPER: '&a[HELPER] &r'
  BLINK_PLUS: '&b[Blink+] &r'
  BLINK_PLUS_PLUS: '&d[Blink++] &r'
  BLINK_PLUS_PLUS_PLUS: '&6[Blink+++] &r'
  MEMBER: '&7[MEMBER] &r'
# Grants from every assigned rank combine; staff hierarchy remains fixed.
# Never grants OP or wildcard '*'.
# Restart after editing this config.
extra-permissions:
  OWNER: [ultimateoptimize.admin]
  DEV: [ultimateoptimize.admin]
  ADMIN: [ultimateoptimize.admin]
  MOD: []
  TRIAL_MOD: []
  HELPER: []
  BLINK_PLUS: []
  BLINK_PLUS_PLUS: []
  BLINK_PLUS_PLUS_PLUS: []
  MEMBER: []

# Blink home limits (3/5/9) are built in and also apply with older configs.
# Extra permissions are additive; another higher maxhomes.# permission still wins.

